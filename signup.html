<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jmail Account Creation</title>
</head>
<body>
    <h1>Create Your Jmail Account</h1>
    <form id="accountCreationForm" action="/createAccount" method="POST">
        <!-- Personal Information -->
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        <label for="idUpload">Upload ID Document:</label>
        <input type="file" id="idUpload" name="idUpload" accept="image/*" required><br><br>
        <!-- Biometric Verification (placeholder for actual implementation) -->
        <label for="biometricData">Biometric Data:</label>
        <input type="text" id="biometricData" name="biometricData" placeholder="Fingerprint/Face recognition" required><br><br>
        <!-- Device Information (collected automatically using JS or backend methods) -->
        <input type="hidden" id="deviceInfo" name="deviceInfo" value="">
        <label for="email">Jmail Address:</label>
        <input type="text" id="email" name="email" placeholder="Generated Email Address" disabled><br><br>
        <button type="submit">Create Account</button>
    </form>
    <script>
        // Function to generate a Jmail address based on the full name and date of birth
        document.getElementById('fullName').addEventListener('input', generateJmail);
        document.getElementById('dob').addEventListener('input', generateJmail);
        function generateJmail() {
            const fullName = document.getElementById('fullName').value;
            const dob = document.getElementById('dob').value;
            if (fullName && dob) {
                const [year, month, day] = dob.split("-");
                const generatedEmail = fullName.replace(/\s+/g, '').toLowerCase() + year + "@jmail.com";
                document.getElementById('email').value = generatedEmail;
            }
        }
        // Mock function to capture device information (can be extended for real device fingerprinting)
        document.getElementById('deviceInfo').value = navigator.userAgent; // Example, real device fingerprints would be more complex
    </script>
</body>
</html>
